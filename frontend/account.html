<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Account — E-Commerce Agent</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">◆</span>
        <div class="brand-text">
          <h1>My Account</h1>
          <p>Sign in to check out and view your orders</p>
        </div>
      </div>
      <nav id="site-nav" class="site-nav" aria-label="Main navigation"></nav>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <span id="theme-toggle-icon">🌙</span>
      </button>
    </div>
  </header>

  <main class="page page-narrow">
    <section id="account-info" class="auth-card" hidden>
      <div class="modal-section-label">Signed in</div>
      <div class="kv-grid">
        <div class="kv-item">
          <div class="kv-label">Email</div>
          <div id="account-email" class="kv-value">—</div>
        </div>
        <div class="kv-item">
          <div class="kv-label">Member since</div>
          <div id="account-created" class="kv-value">—</div>
        </div>
      </div>
      <button id="logout-button" class="btn-primary" type="button">Log out</button>
    </section>

    <section id="auth-forms" class="auth-card" hidden>
      <p id="google-error" class="buy-error google-error" role="alert" hidden></p>
      <div id="google-signin" class="google-signin" hidden>
        <a id="google-signin-link" class="btn-google" href="/auth/google/login">
          <svg class="btn-google-logo" viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          <span>Continue with Google</span>
        </a>
        <div class="auth-divider"><span>or</span></div>
      </div>

      <div class="auth-tabs" role="tablist">
        <button id="tab-login" class="auth-tab is-active" type="button" role="tab">Sign in</button>
        <button id="tab-register" class="auth-tab" type="button" role="tab">Create account</button>
      </div>

      <form id="login-form" class="auth-form">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" required autocomplete="email" />
        <label for="login-password">Password</label>
        <input id="login-password" type="password" required autocomplete="current-password" />
        <button class="btn-primary" type="submit">Sign in</button>
        <p id="login-error" class="buy-error" role="alert" hidden></p>
      </form>

      <form id="register-form" class="auth-form" hidden>
        <label for="register-email">Email</label>
        <input id="register-email" type="email" required autocomplete="email" />
        <label for="register-password">Password</label>
        <input id="register-password" type="password" required minlength="8" autocomplete="new-password" />
        <p class="buy-note">At least 8 characters.</p>
        <button class="btn-primary" type="submit">Create account</button>
        <p id="register-error" class="buy-error" role="alert" hidden></p>
      </form>
    </section>
  </main>

  <script src="/nav.js"></script>
  <script src="/format.js"></script>
  <script src="/theme.js"></script>
  <script src="/auth-google.js"></script>
  <script src="/account.js"></script>
</body>
</html>
